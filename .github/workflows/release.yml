name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 前置关卡：语法 + lint + 单元测试，任何一项失败都不进入打包
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci --ignore-scripts=false

      - name: 语法检查
        run: |
          for f in main.js preload.js renderer.js utils.js utils.test.js; do
            node --check "$f" && echo "OK $f"
          done

      - name: ESLint
        run: npx eslint main.js preload.js renderer.js utils.js

      - name: 单元测试
        run: npx jest

  build-linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 rpm 打包工具
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: 缓存 Electron 下载缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 安装依赖
        run: npm ci --ignore-scripts=false
        env:
          ELECTRON_GET_USE_PROXY: 0

      - name: 确保 Electron 二进制就位
        run: |
          # npm ci 的 postinstall 偶尔会因网络问题静默失败，这里兜底重试
          if [ ! -x node_modules/electron/dist/electron ]; then
            echo "Electron 二进制缺失，开始重试安装"
            for i in 1 2 3 4 5; do
              echo "===== 第 $i 次尝试 ====="
              if (cd node_modules/electron && node install.js); then
                if [ -x node_modules/electron/dist/electron ]; then
                  echo "安装成功"
                  break
                fi
              fi
              echo "第 $i 次失败，等待 15 秒后重试"
              sleep 15
            done
          fi
          if [ ! -x node_modules/electron/dist/electron ]; then
            echo "Electron 二进制安装失败"
            exit 1
          fi
          # 只校验文件存在与大小，不实际执行：CI runner 缺少 SUID sandbox 配置，
          # 直接运行 Electron 会触发 setuid_sandbox_host FATAL 崩溃（与二进制是否完好无关）
          SIZE=$(stat -c%s node_modules/electron/dist/electron)
          echo "Electron 二进制就位，大小 $SIZE 字节"
          if [ "$SIZE" -lt 52428800 ]; then
            echo "Electron 二进制异常偏小，疑似下载不完整"
            exit 1
          fi

      - name: 打包 AppImage / deb / rpm
        run: npx electron-builder --linux AppImage deb rpm

      - name: 校验产物完整性
        run: |
          ls -lh app_file/
          for f in app_file/*.AppImage app_file/*.deb app_file/*.rpm; do
            [ -f "$f" ] || { echo "缺少产物: $f"; exit 1; }
            SIZE=$(stat -c%s "$f")
            if [ "$SIZE" -lt 10485760 ]; then
              echo "产物异常偏小 ($SIZE 字节): $f"
              exit 1
            fi
          done
          echo "全部 Linux 产物校验通过"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            app_file/*.AppImage
            app_file/*.deb
            app_file/*.rpm
          if-no-files-found: error

  build-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 缓存 Electron 下载缓存
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 安装依赖
        run: npm ci --ignore-scripts=false
        env:
          ELECTRON_GET_USE_PROXY: 0

      - name: 确保 Electron 二进制就位
        shell: pwsh
        run: |
          if (-not (Test-Path "node_modules/electron/dist/electron.exe")) {
            Write-Host "Electron 二进制缺失，重试安装"
            foreach ($i in 1..3) {
              Write-Host "第 $i 次尝试"
              Push-Location node_modules/electron
              node install.js
              $ok = $LASTEXITCODE -eq 0
              Pop-Location
              if ($ok -and (Test-Path "node_modules/electron/dist/electron.exe")) { break }
              Start-Sleep -Seconds 10
            }
          }
          if (-not (Test-Path "node_modules/electron/dist/electron.exe")) {
            Write-Error "Electron 二进制安装失败"
            exit 1
          }

      - name: 打包 Windows 安装包
        run: npx electron-builder --win

      - name: 校验产物完整性
        shell: pwsh
        run: |
          Get-ChildItem app_file/*.exe | Format-Table Name, Length
          $exe = Get-ChildItem app_file/*.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "未生成 exe"; exit 1 }
          if ($exe.Length -lt 10485760) {
            Write-Error "产物异常偏小 ($($exe.Length) 字节): $($exe.Name)"
            exit 1
          }
          Write-Host "Windows 产物校验通过"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: app_file/*.exe
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 确定发布标签
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "发布标签: ${TAG}"

      - name: 列出待发布文件
        run: ls -lh dist

      - name: 创建 / 更新 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: NetCmdRegister ${{ steps.tag.outputs.tag }}
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
